<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fichero 50x14</title><style>body{font-family:Segoe UI,Arial;background:#f3f6f9;margin:0;color:#172033}.wrap{max-width:1050px;margin:30px auto;padding:18px}.card{background:#fff;border-radius:14px;padding:22px;box-shadow:0 5px 20px #0001;margin-bottom:18px}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}button{border:0;border-radius:8px;padding:11px 16px;font-weight:700;background:#1769aa;color:#fff}.secondary{background:#e8eef5;color:#17365d}.status{padding:8px 11px;border-radius:20px;background:#eee}.ok{background:#dff5e4;color:#17652a}.err{background:#fee4e2;color:#a6221a}.item{display:grid;grid-template-columns:34px 1fr 410px;gap:14px;align-items:center;padding:11px;border:1px solid #dfe6ee;border-radius:10px;margin-top:12px}.preview{width:400px;height:112px;border:1px solid #111;image-rendering:pixelated}</style></head><body><div class="wrap"><div class="card"><h1>Impression étiquettes Fichero</h1><p>50 × 14 mm • 3 colonnes × 4 lignes • police fixe 25 px</p><div class="bar"><button id="connect">Connecter Fichero</button><button id="print" disabled>Imprimer la sélection</button><button id="all" class="secondary">Tout sélectionner</button><span id="status" class="status">Non connectée</span></div></div><div class="card" id="list"></div></div><script>
const SERVICES=[['000018f0-0000-1000-8000-00805f9b34fb','00002af1-0000-1000-8000-00805f9b34fb'],['0000ff00-0000-1000-8000-00805f9b34fb','0000ff02-0000-1000-8000-00805f9b34fb']];let device=null,writeChar=null;const $=s=>document.querySelector(s),list=$('#list'),statusEl=$('#status');function dec(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return decodeURIComponent(escape(atob(s)))}function labels(){try{let m=location.hash.match(/(?:^#|&)data=([^&]+)/);return m?JSON.parse(dec(m[1])):[]}catch(e){return[]}}let data=labels();function status(t,ok=null){statusEl.textContent=t;statusEl.className='status'+(ok===true?' ok':ok===false?' err':'')}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function makeCanvas(d){const c=document.createElement('canvas');c.width=400;c.height=112;const x=c.getContext('2d',{willReadFrequently:true});x.fillStyle='#fff';x.fillRect(0,0,400,112);x.fillStyle='#000';x.textBaseline='middle';x.font='700 25px Arial';const cw=400/3,rh=112/4,pad=5,right=8;function cell(t,col,row,a){t=String(t||'');if(!t)return;x.font='700 25px Arial';x.textAlign=a;let px=col*cw+pad;if(a==='center')px=col*cw+cw/2;if(a==='right')px=(col+1)*cw-(col===2?right:pad);x.fillText(t,px,row*rh+rh/2)}cell(d.client,0,0,'left');cell(d.nomChantier,2,1,'right');cell(d.noeuds,1,2,'center');cell(d.transportRef,0,3,'left');return c}
function render(){list.innerHTML='';if(!data.length){list.innerHTML='Aucune donnée. Lancez depuis Excel.';return}data.forEach((d,i)=>{let r=document.createElement('div');r.className='item';let cb=document.createElement('input');cb.type='checkbox';cb.checked=true;cb.dataset.i=i;let info=document.createElement('div');info.innerHTML=`<b>${esc(d.client)}</b><br>${esc(d.nomChantier)}<br>NOEUDS : ${esc(d.noeuds)}<br>${esc(d.transportRef)}`;let c=makeCanvas(d);c.className='preview';r.append(cb,info,c);list.append(r)})}
async function connect(){try{device=await navigator.bluetooth.requestDevice({filters:[{namePrefix:'FICHERO_'},{namePrefix:'D11s_'}],optionalServices:SERVICES.map(x=>x[0])});const s=await device.gatt.connect();for(const [su,cu] of SERVICES){try{writeChar=await (await s.getPrimaryService(su)).getCharacteristic(cu);break}catch(e){}}if(!writeChar)throw Error('Service BLE introuvable');$('#print').disabled=false;status('Connectée : '+device.name,true)}catch(e){status(e.message,false)}}function u8(...v){return new Uint8Array(v)}async function write(d){for(let i=0;i<d.length;i+=180){let p=d.slice(i,i+180);if(writeChar.writeValueWithoutResponse)await writeChar.writeValueWithoutResponse(p);else await writeChar.writeValue(p)}}function raster(c){let x=c.getContext('2d'),im=x.getImageData(0,0,400,112).data,o=new Uint8Array(4800);for(let r=0;r<400;r++)for(let p=0;p<96;p++){let y=Math.min(111,Math.floor((95-p)*112/96)),i=(y*400+r)*4;if((im[i]+im[i+1]+im[i+2])/3<128)o[r*12+(p>>3)]|=1<<(7-(p&7))}return o}async function one(d){let b=raster(makeCanvas(d)),rows=400;await write(u8(0x10,0xff,0x10,0,1));await write(u8(0x10,0xff,0x84,0));await write(new Uint8Array(12));await write(u8(0x10,0xff,0xfe,1));await write(u8(0x1d,0x76,0x30,0,0x0c,0,rows&255,rows>>8));await write(b);await write(u8(0x1d,0x0c));await write(u8(0x10,0xff,0xfe,0x45));await new Promise(r=>setTimeout(r,1100))}async function print(){let ids=[...document.querySelectorAll('input:checked')].map(x=>+x.dataset.i);if(!writeChar)return status('Connectez d’abord la Fichero',false);$('#print').disabled=true;try{for(let i=0;i<ids.length;i++){status(`Impression ${i+1}/${ids.length}…`);await one(data[ids[i]])}status('Impression terminée',true)}catch(e){status(e.message,false)}$('#print').disabled=false}$('#connect').onclick=connect;$('#print').onclick=print;$('#all').onclick=()=>document.querySelectorAll('input[type=checkbox]').forEach(x=>x.checked=true);render();
</script></body></html>
